location ~ "^/build/assets/[^/.][^/]*-[A-Za-z0-9_-]{8}[.](?:woff2?|svg)$" {
    include nginxconfig.io/atb-immutable-cache.conf;
    add_header Access-Control-Allow-Origin "*";
}

location ~ "^/build/assets/[^/.][^/]*-[A-Za-z0-9_-]{8}[.](?:css|js|mjs|wasm|png|webp|avif)$" {
    include nginxconfig.io/atb-immutable-cache.conf;
}
