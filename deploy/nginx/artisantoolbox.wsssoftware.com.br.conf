server {
    listen 80;
    listen [::]:80;

    server_name artisantoolbox.wsssoftware.com.br;

    root /var/www/artisantoolbox/dist;
    index index.html;

    access_log /var/log/nginx/artisantoolbox.wsssoftware.com.br.access.log;
    error_log /var/log/nginx/artisantoolbox.wsssoftware.com.br.error.log;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location /_astro/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /pagefind/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }
}
