name: tests

on:
  push:
    branches:
      - 1.x
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.5'
          extensions: bcmath, gd, intl, pdo_sqlite, redis, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Check shared agent standards
        run: npm run standards:check

      - name: Check distribution lock
        run: php scripts/check-distribution.php

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install frontend dependencies
        env:
          WEBAWESOME_NPM_TOKEN: ${{ secrets.WEBAWESOME_NPM_TOKEN }}
        run: npm ci

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear

      - name: Build assets
        run: npm run build

      - name: Build documentation search index
        run: |
          php artisan docs:search:index --no-interaction
          php artisan docs:search:index --check --no-interaction

      - name: Install Chromium for interactive documentation
        run: npx playwright install --with-deps chromium --only-shell

      - name: Verify interactive documentation
        env:
          APP_URL: http://127.0.0.1:8080
          DOCS_BASE_URL: http://127.0.0.1:8080
          SESSION_DRIVER: file
          DB_DATABASE: ${{ runner.temp }}/documentation-browser.sqlite
        run: |
          touch "$DB_DATABASE"
          php artisan migrate --force --no-interaction
          php artisan serve --no-reload --host=127.0.0.1 --port=8080 > storage/logs/browser-server.log 2>&1 &
          browser_server_pid=$!
          trap 'kill "$browser_server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            if curl --fail --silent "$APP_URL/up" > /dev/null; then break; fi
            sleep 0.2
          done
          if ! curl --fail --silent "$APP_URL/up" > /dev/null; then
            cat storage/logs/browser-server.log
            exit 1
          fi
          npm run test:browser

      - name: Run Rector check
        run: composer rector:check

      - name: Run CI Checks
        run: php vendor/bin/maintainer quality:check --no-interaction
