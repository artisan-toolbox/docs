name: tests

on:
  push:
    branches:
      - 1.x
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: testing
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.5'
          extensions: bcmath, gd, intl, pdo_sqlite, redis, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Check shared agent standards
        run: npm run standards:check

      - name: Check distribution lock
        run: php scripts/check-distribution.php

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install frontend dependencies
        env:
          WEBAWESOME_NPM_TOKEN: ${{ secrets.WEBAWESOME_NPM_TOKEN }}
        run: npm ci

      - name: Check frontend dependency advisories
        run: npm run audit:check

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear

      - name: Build assets
        env:
          VITE_REVERB_APP_KEY: documentation-ci
          VITE_REVERB_HOST: 127.0.0.1
          VITE_REVERB_PORT: '8081'
          VITE_REVERB_SCHEME: http
        run: npm run build

      - name: Build documentation search index
        run: |
          php artisan docs:search:index --no-interaction
          php artisan docs:search:index --check --no-interaction

      - name: Install Chromium for interactive documentation
        run: npx playwright install --with-deps chromium --only-shell

      - name: Verify interactive documentation
        env:
          APP_URL: http://localhost:8080
          DOCS_BASE_URL: http://localhost:8080
          CACHE_STORE: database
          SESSION_DRIVER: file
          DB_DATABASE: ${{ runner.temp }}/documentation-browser.sqlite
          BROADCAST_CONNECTION: reverb
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: ${{ job.services.redis.ports[6379] }}
          REVERB_APP_ID: documentation-ci
          REVERB_APP_KEY: documentation-ci
          REVERB_HOST: 127.0.0.1
          REVERB_PORT: '8081'
          REVERB_SCHEME: http
        run: |
          export REVERB_APP_SECRET="$(php -r 'echo bin2hex(random_bytes(32));')"
          touch "$DB_DATABASE"
          php artisan migrate --force --no-interaction
          php scripts/setup-dapter-literal.php
          php artisan reverb:start --host=127.0.0.1 --port="$REVERB_PORT" --no-interaction > storage/logs/browser-reverb.log 2>&1 &
          reverb_pid=$!
          php artisan serve --no-reload --host=127.0.0.1 --port=8080 > storage/logs/browser-server.log 2>&1 &
          browser_server_pid=$!
          php artisan queue:work redis --queue=demos --sleep=1 --tries=1 --no-interaction > storage/logs/browser-queue.log 2>&1 &
          queue_pid=$!
          trap 'kill "$browser_server_pid" "$reverb_pid" "$queue_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            if curl --fail --silent "$APP_URL/up" > /dev/null && curl --silent "http://127.0.0.1:$REVERB_PORT/" > /dev/null; then break; fi
            sleep 0.2
          done
          if ! curl --fail --silent "$APP_URL/up" > /dev/null || ! curl --silent "http://127.0.0.1:$REVERB_PORT/" > /dev/null || ! kill -0 "$queue_pid" 2>/dev/null; then
            cat storage/logs/browser-server.log storage/logs/browser-reverb.log storage/logs/browser-queue.log
            exit 1
          fi
          npm run test:browser

      - name: Run Rector check
        run: composer rector:check

      - name: Run CI Checks
        run: php vendor/bin/maintainer quality:check --no-interaction
