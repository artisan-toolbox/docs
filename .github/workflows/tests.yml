name: tests

on:
  push:
    branches:
      - 1.x
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'latest' || github.sha }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: testing
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check distribution lock
        run: php scripts/check-distribution.php

      - name: Set up CI dependencies
        uses: artisan-toolbox/maintainer@f3ace73a7020f1a76a62fa3c9137b1b541bb8cc8 # 1.14.3
        with:
          php-version: '8.5'
          php-extensions: bcmath, gd, intl, pdo_sqlite, redis, zip
          composer-validation: strict
          node-version: '24'
          npm-install: 'false'

      - name: Check shared agent standards
        run: npm run standards:check

      - name: Install frontend dependencies
        env:
          WEBAWESOME_NPM_TOKEN: ${{ secrets.WEBAWESOME_NPM_TOKEN }}
        run: |
          if [[ -z "$WEBAWESOME_NPM_TOKEN" ]]; then
            echo '::error::Installing the documentation lock requires the Web Awesome Pro registry secret. Fork pull requests cannot access this secret.'
            exit 1
          fi
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Check frontend dependency advisories
        run: npm run audit:check

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Build assets and verify the search index
        env:
          VITE_REVERB_APP_KEY: documentation-ci
          VITE_REVERB_HOST: 127.0.0.1
          VITE_REVERB_PORT: '8081'
          VITE_REVERB_SCHEME: http
        run: composer ci:assets

      - name: Run CI checks
        run: composer ci:check

      - name: Install Chromium for interactive documentation
        run: npm exec --no -- playwright install --with-deps chromium --only-shell

      - name: Verify interactive documentation
        env:
          APP_URL: http://localhost:8080
          DOCS_BASE_URL: http://localhost:8080
          CACHE_STORE: database
          SESSION_DRIVER: file
          DB_DATABASE: ${{ runner.temp }}/documentation-browser.sqlite
          BROADCAST_CONNECTION: reverb
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
          REVERB_APP_ID: documentation-ci
          REVERB_APP_KEY: documentation-ci
          REVERB_HOST: 127.0.0.1
          REVERB_PORT: '8081'
          REVERB_SCHEME: http
        run: |
          export REVERB_APP_SECRET="$(php -r 'echo bin2hex(random_bytes(32));')"
          touch "$DB_DATABASE"
          php artisan migrate --force --no-interaction
          php scripts/setup-dapter-literal.php
          php artisan reverb:start --host=127.0.0.1 --port="$REVERB_PORT" --no-interaction > storage/logs/browser-reverb.log 2>&1 &
          reverb_pid=$!
          php artisan serve --no-reload --host=127.0.0.1 --port=8080 > storage/logs/browser-server.log 2>&1 &
          browser_server_pid=$!
          php artisan queue:work redis --queue=demos --sleep=1 --tries=1 --no-interaction > storage/logs/browser-queue.log 2>&1 &
          queue_pid=$!
          trap 'kill "$browser_server_pid" "$reverb_pid" "$queue_pid" 2>/dev/null || true' EXIT
          ready() {
            curl --fail --silent --max-time 1 "$APP_URL/up" > /dev/null &&
              curl --silent --max-time 1 "http://127.0.0.1:$REVERB_PORT/" > /dev/null &&
              kill -0 "$queue_pid" "$reverb_pid" "$browser_server_pid" 2>/dev/null
          }
          for attempt in {1..50}; do
            if ready; then break; fi
            sleep 0.2
          done
          if ! ready; then
            cat storage/logs/browser-server.log storage/logs/browser-reverb.log storage/logs/browser-queue.log
            exit 1
          fi
          npm run test:browser
